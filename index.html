<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#070a18" />
<title>生日快乐</title>
<style>
  /* ============================================================
     基础变量
     ============================================================ */
  :root{
    --cream: #fff4e0;
    --gold: #f2cf9a;
    --gold-soft: rgba(242, 207, 154, .55);
    --serif: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif SC",
             Georgia, "Times New Roman", serif;
    --sans: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei",
            "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *{ box-sizing: border-box; }

  html{
    -webkit-text-size-adjust: 100%;
    height: 100%;
  }

  body{
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;          /* 375px 宽度下绝不横向溢出 */
    overflow-y: auto;
    background:
      radial-gradient(125% 85% at 50% -12%, #1c2653 0%, #101638 30%, #090e24 60%, #05060f 100%);
    color: var(--cream);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* ============================================================
     星云层（纯 CSS 渐变，无外部图片）
     ============================================================ */
  .nebula{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    overflow: hidden;
  }

  .nebula::before,
  .nebula::after{
    content: "";
    position: absolute;
    border-radius: 50%;
    will-change: transform, opacity;
  }

  .n1::before{
    width: 78vmax; height: 76vmax;
    left: -24vmax; top: -32vmax;
    background: radial-gradient(circle at 50% 50%,
      rgba(112, 84, 226, .34) 0%,
      rgba(84, 62, 190, .16) 36%,
      rgba(40, 30, 96, 0) 68%);
  }
  .n1::after{
    width: 62vmax; height: 62vmax;
    right: -16vmax; top: 8vmax;
    background: radial-gradient(circle at 50% 50%,
      rgba(58, 128, 200, .24) 0%,
      rgba(42, 86, 158, .10) 40%,
      rgba(20, 40, 96, 0) 70%);
  }
  .n2::before{
    width: 92vmax; height: 74vmax;
    left: -12vmax; bottom: -36vmax;
    background: radial-gradient(circle at 50% 50%,
      rgba(158, 74, 168, .22) 0%,
      rgba(104, 52, 138, .09) 42%,
      rgba(42, 20, 64, 0) 72%);
  }
  .n2::after{
    width: 48vmax; height: 48vmax;
    right: 4vmax; bottom: 4vmax;
    background: radial-gradient(circle at 50% 50%,
      rgba(255, 206, 142, .11) 0%,
      rgba(255, 180, 112, .045) 46%,
      rgba(255, 170, 100, 0) 70%);
  }
  .n3::before{
    width: 54vmax; height: 40vmax;
    left: 18vmax; top: 10vmax;
    background: radial-gradient(circle at 50% 50%,
      rgba(122, 190, 210, .10) 0%,
      rgba(80, 140, 190, .04) 46%,
      rgba(40, 80, 140, 0) 72%);
  }
  .n3::after{
    width: 40vmax; height: 40vmax;
    left: 42vmax; bottom: 16vmax;
    background: radial-gradient(circle at 50% 50%,
      rgba(190, 150, 255, .09) 0%,
      rgba(130, 100, 220, .035) 50%,
      rgba(90, 60, 180, 0) 74%);
  }

  @media (prefers-reduced-motion: no-preference){
    .nebula::before{ animation: nebulaDriftA 54s ease-in-out infinite alternate; }
    .nebula::after{ animation: nebulaDriftB 72s ease-in-out infinite alternate-reverse; }
  }

  @keyframes nebulaDriftA{
    from{ transform: translate3d(0, 0, 0) scale(1); opacity: .85; }
    to  { transform: translate3d(2.4vmax, -2vmax, 0) scale(1.09); opacity: 1; }
  }
  @keyframes nebulaDriftB{
    from{ transform: translate3d(0, 0, 0) scale(1); opacity: .7; }
    to  { transform: translate3d(-2vmax, 1.6vmax, 0) scale(1.06); opacity: 1; }
  }

  /* ============================================================
     星空 / 烟花画布
     ============================================================ */
  #sky{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    display: block;
    pointer-events: none;
  }

  /* ============================================================
     主舞台
     ============================================================ */
  .stage{
    position: relative;
    z-index: 2;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: clamp(16px, 3.2vh, 42px);
    padding-bottom: max(clamp(16px, 3.2vh, 42px), env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }

  .center-stack{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.9vh, 18px);
    width: fit-content;
    max-width: 100%;
  }

  /* ---------- 主标题 ---------- */
  .title{
    margin: 0;
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(20px, 5vw, 40px);
    letter-spacing: .18em;
    text-indent: .18em;
    line-height: 1.4;
    text-align: center;
    color: #ffeacb;
    text-shadow:
      0 0 20px rgba(255, 206, 132, .38),
      0 0 56px rgba(182, 142, 255, .24);
    transition: opacity 1.2s ease, transform 1.4s cubic-bezier(.2,.75,.25,1), filter 1.2s ease;
  }

  .celebrating .title{
    opacity: .34;
    transform: translateY(-4px) scale(.9);
    filter: blur(.3px);
  }

  /* ---------- 蛋糕 ---------- */
  .cake{
    position: relative;
    width: clamp(172px, 44vw, 252px);
    aspect-ratio: 260 / 250;
    cursor: pointer;
    outline: none;
    filter: drop-shadow(0 24px 34px rgba(3, 1, 16, .55))
            drop-shadow(0 0 30px rgba(255, 186, 110, .16));
    transition: transform 1.3s cubic-bezier(.22, .78, .24, 1);
    z-index: 1;
  }

  .cake svg{
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .cake::before{
    content: "";
    position: absolute;
    left: 50%;
    top: 42%;
    width: 160%;
    height: 160%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 50% 50%,
      rgba(255, 196, 128, .30) 0%,
      rgba(255, 160, 92, .12) 36%,
      rgba(255, 150, 80, 0) 68%);
    pointer-events: none;
    z-index: -1;
  }

  @media (prefers-reduced-motion: no-preference){
    .cake::before{ animation: cakeGlow 4.8s ease-in-out infinite; }
  }

  @keyframes cakeGlow{
    0%, 100%{ opacity: .72; transform: translate(-50%, -50%) scale(1); }
    50%     { opacity: 1;   transform: translate(-50%, -50%) scale(1.07); }
  }

  .celebrating .cake{
    transform: scale(.8) translateY(-2px);
  }

  /* ---------- 烛火摇曳 / 熄灭 / 轻烟 ---------- */
  .flame{
    transform-box: fill-box;
    transform-origin: 50% 62%;
    will-change: transform;
  }

  @media (prefers-reduced-motion: no-preference){
    .flame{
      animation: flicker 1.7s ease-in-out infinite;
      animation-delay: var(--fd, 0s);
    }
  }

  @keyframes flicker{
    0%, 100%{ transform: rotate(-2deg) scale(1, 1); opacity: .96; }
    22%     { transform: rotate(2.4deg) scale(.95, 1.09); opacity: 1; }
    46%     { transform: rotate(-1.2deg) scale(1.05, .94); opacity: .92; }
    70%     { transform: rotate(1.6deg) scale(.97, 1.05); opacity: 1; }
  }

  .cake.blown .flame{
    animation: flameOut .6s cubic-bezier(.3, .7, .4, 1) forwards;
  }

  @keyframes flameOut{
    from{ opacity: .95; transform: scale(1, 1); }
    40% { opacity: .55; transform: scale(.8, 1.15) translateY(-2px); }
    to  { opacity: 0;   transform: scale(.55, .25) translateY(-7px); }
  }

  .smoke-dot{
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    pointer-events: none;
  }

  .cake.blown .smoke-dot{
    animation: smokeUp 2.8s ease-out forwards;
    animation-delay: var(--sd, 0s);
  }

  @keyframes smokeUp{
    0%  { opacity: 0;   transform: translate(0, 0) scale(.5); }
    18% { opacity: .48; }
    100%{ opacity: 0;   transform: translate(-2px, -30px) scale(3); }
  }

  .candle-glow{
    transition: opacity 1.2s ease;
  }

  .cake.blown .candle-glow{ opacity: 0; }

  .cake:focus-visible{
    outline: 1px solid rgba(242, 207, 154, .7);
    outline-offset: 8px;
    border-radius: 18px;
  }

  /* ---------- 许愿提示 ---------- */
  .hint{
    margin: 0;
    font-size: clamp(11px, 3.1vw, 14px);
    letter-spacing: .2em;
    text-indent: .2em;
    text-align: center;
    color: rgba(255, 236, 206, .72);
    text-shadow: 0 0 18px rgba(255, 190, 120, .3);
    transition: opacity .7s ease, transform .7s ease;
  }

  @media (prefers-reduced-motion: no-preference){
    .hint{ animation: hintPulse 2.8s ease-in-out infinite; }
    @keyframes hintPulse{
      0%, 100%{ opacity: .42; }
      50%     { opacity: .92; }
    }
  }

  .celebrating .hint{
    opacity: 0;
    transform: translateY(-4px);
    animation: none;
    pointer-events: none;
  }

  /* ---------- 核心祝福（逐字浮现） ---------- */
  .core{
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(17px, 2.35vw, 27px);
    line-height: 1.95;
    letter-spacing: .075em;
    text-align: center;
    max-width: min(94vw, 780px);
    color: #fff3dd;
    text-shadow:
      0 0 18px rgba(255, 208, 132, .42),
      0 0 46px rgba(190, 150, 255, .30);
    opacity: 0;
    transition: opacity .9s ease;
  }

  .core-line{
    display: inline-block;
    white-space: nowrap;
  }

  .ch{
    display: inline-block;
    opacity: 0;
    transform: translateY(.2em) scale(.92);
  }

  .celebrating .core{ opacity: 1; }

  .celebrating .ch{
    animation: chIn 1.1s cubic-bezier(.22, .72, .28, 1) forwards;
    animation-delay: var(--d, 0s);
  }

  @keyframes chIn{
    0%  { opacity: 0; transform: translateY(.24em) scale(.9); filter: blur(9px); }
    55% { opacity: 1; filter: blur(0); }
    100%{ opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  /* ---------- 落款 ---------- */
  .signature{
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2.4vw, 16px);
    font-family: var(--serif);
    font-size: clamp(11.5px, 3.05vw, 14px);
    letter-spacing: .24em;
    white-space: nowrap;
    color: rgba(255, 234, 205, .74);
    text-shadow: 0 0 14px rgba(255, 198, 138, .22);
    opacity: 0;
    transition: opacity 1.4s ease 1.15s;
  }

  .signature::before,
  .signature::after{
    content: "";
    width: clamp(18px, 5.5vw, 44px);
    height: 1px;
    background: linear-gradient(90deg, rgba(242, 207, 154, 0), rgba(242, 207, 154, .62));
  }

  .signature::after{
    transform: rotate(180deg);
  }

  .celebrating .signature{ opacity: 1; }

  /* ---------- 烟花按钮 ---------- */
  .btn-fire{
    margin-top: 2px;
    padding: 12px 24px;
    min-height: 44px;
    border: 1px solid rgba(242, 207, 154, .3);
    border-radius: 999px;
    background: rgba(255, 246, 226, .035);
    color: rgba(255, 238, 212, .82);
    font-family: var(--sans);
    font-size: clamp(12px, 3.2vw, 14px);
    letter-spacing: .14em;
    text-indent: .14em;
    white-space: nowrap;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: opacity 1.1s ease 1.45s,
                background .3s ease,
                border-color .3s ease,
                transform .25s ease;
  }

  .celebrating .btn-fire{
    opacity: .92;
    pointer-events: auto;
  }

  .btn-fire:hover{
    background: rgba(255, 226, 178, .1);
    border-color: rgba(242, 207, 154, .58);
  }

  .btn-fire:active{ transform: scale(.96); }

  .btn-fire:focus-visible{
    outline: 1px solid rgba(242, 207, 154, .8);
    outline-offset: 4px;
  }

  /* ============================================================
     祝福星河（星尘文字，非弹幕）
     ============================================================ */
  .blessing-layer{
    position: fixed;
    inset: 0;
    z-index: 3;
    overflow: hidden;
    pointer-events: none;
  }

  .blessing{
    --peak: .95;
    --dx: 0px;
    position: absolute;
    margin: 0;
    padding: 0;
    max-width: min(92vw, 680px);
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(21px, 2.45vw, 31px);
    line-height: 1.45;
    letter-spacing: .05em;
    text-align: center;
    color: #fff6e8;
    text-shadow:
      0 0 10px rgba(255, 214, 150, .95),
      0 0 26px rgba(255, 190, 120, .55),
      0 0 46px rgba(180, 150, 255, .35);
    opacity: 0;
    pointer-events: none;
    animation-name: blessIn;
    animation-duration: 6.5s;
    animation-timing-function: cubic-bezier(.25, .62, .35, 1);
    animation-fill-mode: forwards;
    will-change: transform, opacity;
  }

  @keyframes blessIn{
    0%  { opacity: 0; transform: translate3d(var(--dx), 20px, 0); filter: blur(6px); }
    12% { opacity: var(--peak); transform: translate3d(calc(var(--dx) * .35), 2px, 0); filter: blur(0); }
    70% { opacity: calc(var(--peak) * .82); transform: translate3d(calc(var(--dx) * .8), -22px, 0); }
    100%{ opacity: 0; transform: translate3d(calc(var(--dx) * 1.4), -50px, 0); filter: blur(5px); }
  }

  @media (max-width: 640px){
    .blessing{
      --peak: .72;
      max-width: 92vw;
      font-size: clamp(17px, 4.4vw, 21px);
      line-height: 1.45;
    }
  }

  /* ============================================================
     减少动效降级
     ============================================================ */
  @media (prefers-reduced-motion: reduce){
    .nebula::before,
    .nebula::after,
    .cake::before,
    .hint{
      animation: none !important;
    }

    .ch{
      opacity: 1;
      transform: none;
    }

    .celebrating .ch{
      animation: none;
    }

    .core,
    .signature,
    .btn-fire,
    .title,
    .cake{
      transition-duration: .2s;
    }

    .blessing{
      animation: blessStill var(--dur, 9s) linear forwards;
    }

    @keyframes blessStill{
      0%  { opacity: 0; }
      8%  { opacity: var(--peak); }
      88% { opacity: var(--peak); }
      100%{ opacity: 0; }
    }
  }
  /* ============================================================
     荣耀 200 Pro 专项：CSS 视口宽 ≈412px 的断点微调
     （不写 width=375/414，统一跟随 device-width）
     ============================================================ */
  @media (min-width: 412px) and (max-width: 640px){
    .cake{ width: clamp(178px, 43vw, 218px); }
    .blessing{ max-width: 38vw; font-size: 11.5px; }
    .btn-fire{ white-space: nowrap; }
  }

  @media (max-width: 412px){
    .stage{
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }

    .title{
      font-size: clamp(19px, 5.4vw, 23px);
      letter-spacing: .16em;
      text-indent: .16em;
    }

    .cake{
      width: clamp(166px, 45vw, 196px);
    }

    .hint{
      font-size: 11px;
      letter-spacing: .16em;
      text-indent: .16em;
    }

    .core{
      font-size: 16.5px;
      line-height: 1.85;
      letter-spacing: .05em;
    }

    .signature{
      gap: 8px;
      font-size: 11.5px;
      letter-spacing: .18em;
    }

    .btn-fire{
      padding: 12px 20px;
      font-size: 12.5px;
      white-space: nowrap;
      max-width: 100%;
    }

    .blessing{
      max-width: 92vw;
      font-size: 19px;
      line-height: 1.45;
      --peak: .75;
    }
  }
</style>
</head>
<body>

  <!-- 星云背景 -->
  <div class="nebula n1" aria-hidden="true"></div>
  <div class="nebula n2" aria-hidden="true"></div>
  <div class="nebula n3" aria-hidden="true"></div>

  <!-- 星空与烟花 -->
  <canvas id="sky" aria-hidden="true"></canvas>

  <!-- 主内容 -->
  <main class="stage">
    <div class="center-stack" id="centerStack">

      <h1 class="title" id="title"></h1>

      <div class="cake" id="cake" role="button" tabindex="0" aria-label="轻触蜡烛，许个愿吧">
        <svg viewBox="0 0 260 250" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <defs>
            <!-- 三层饼体：顶层奶油白 / 中层香槟 / 底层淡粉 -->
            <linearGradient id="gTopTier" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fffdf6"/>
              <stop offset=".5" stop-color="#ffeccd"/>
              <stop offset="1" stop-color="#f0c99c"/>
            </linearGradient>
            <linearGradient id="gMidTier" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff6e8"/>
              <stop offset=".45" stop-color="#fbd7ae"/>
              <stop offset="1" stop-color="#e0a97a"/>
            </linearGradient>
            <linearGradient id="gBotTier" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffeae3"/>
              <stop offset=".45" stop-color="#f8c6b9"/>
              <stop offset="1" stop-color="#d9958a"/>
            </linearGradient>

            <!-- 顶面（径向渐变，带受光感） -->
            <radialGradient id="gTopFace1" cx="42%" cy="36%" r="72%">
              <stop offset="0" stop-color="#fff7f0"/>
              <stop offset=".7" stop-color="#f9d3c7"/>
              <stop offset="1" stop-color="#eeb4a7"/>
            </radialGradient>
            <radialGradient id="gTopFace2" cx="42%" cy="36%" r="72%">
              <stop offset="0" stop-color="#fffaf1"/>
              <stop offset=".7" stop-color="#fbe0be"/>
              <stop offset="1" stop-color="#eec094"/>
            </radialGradient>
            <radialGradient id="gTopFace3" cx="42%" cy="36%" r="72%">
              <stop offset="0" stop-color="#fffefb"/>
              <stop offset=".7" stop-color="#fff1d9"/>
              <stop offset="1" stop-color="#f5d1a6"/>
            </radialGradient>

            <!-- 奶油花边 -->
            <linearGradient id="gCream" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fffefb"/>
              <stop offset=".55" stop-color="#fff7ea"/>
              <stop offset="1" stop-color="#fbe5c9"/>
            </linearGradient>

            <!-- 侧面明暗 / 底部内阴影 -->
            <linearGradient id="gSideShade" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
              <stop offset=".28" stop-color="#ffffff" stop-opacity=".06"/>
              <stop offset=".6" stop-color="#6b3428" stop-opacity="0"/>
              <stop offset="1" stop-color="#6b3428" stop-opacity=".22"/>
            </linearGradient>
            <linearGradient id="gBottomShade" x1="0" y1="0" x2="0" y2="1">
              <stop offset=".42" stop-color="#5a2418" stop-opacity="0"/>
              <stop offset="1" stop-color="#5a2418" stop-opacity=".26"/>
            </linearGradient>

            <!-- 盘子 -->
            <linearGradient id="gPlate" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffedcb"/>
              <stop offset=".38" stop-color="#e7c197"/>
              <stop offset="1" stop-color="#94688a"/>
            </linearGradient>
            <radialGradient id="gPlateGlow">
              <stop offset="0" stop-color="#ffd39c" stop-opacity=".55"/>
              <stop offset=".55" stop-color="#ffb066" stop-opacity=".18"/>
              <stop offset="1" stop-color="#ff9f55" stop-opacity="0"/>
            </radialGradient>

            <!-- 火焰：径向渐变 + 外光晕 -->
            <radialGradient id="gFlameCore" cx="50%" cy="72%" r="62%">
              <stop offset="0" stop-color="#fffdf2"/>
              <stop offset=".4" stop-color="#ffe3a0"/>
              <stop offset=".75" stop-color="#ffb054"/>
              <stop offset="1" stop-color="#ff8a3d"/>
            </radialGradient>
            <radialGradient id="gFlameGlow">
              <stop offset="0" stop-color="#ffd98f" stop-opacity=".62"/>
              <stop offset=".42" stop-color="#ffa954" stop-opacity=".26"/>
              <stop offset="1" stop-color="#ff9848" stop-opacity="0"/>
            </radialGradient>

            <!-- “19” 糖牌 -->
            <linearGradient id="gPlaque" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fffdf7"/>
              <stop offset=".55" stop-color="#fff1dc"/>
              <stop offset="1" stop-color="#f0d6b0"/>
            </linearGradient>
            <linearGradient id="gPlaqueText" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f9dfae"/>
              <stop offset=".5" stop-color="#e3b471"/>
              <stop offset="1" stop-color="#b9843f"/>
            </linearGradient>

            <pattern id="pCandle" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
              <rect width="6" height="6" fill="#fff8ee"/>

/* ================================================================
   工具函数
   ================================================================ */
const rand = (min, max) => min + Math.random() * (max - min);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const tmp = arr[i];
    arr[i] = arr[j];
    arr[j] = tmp;
  }
  return arr;
}

const $id = (id) => document.getElementById(id);

/* ================================================================
   DOM
   ================================================================ */
const titleEl = $id("title");
const cakeEl = $id("cake");
const hintEl = $id("hint");
const coreEl = $id("core");
const signatureEl = $id("signature");
const btnFire = $id("btnFire");
const blessingLayer = $id("blessingLayer");
const centerStack = $id("centerStack");

let maxBlessings = 3;   // 412dp 及以下窄屏自动降为 2 条

/* 减少动效偏好 */
const reduceQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
let reduced = reduceQuery.matches;

/* 运行状态 */
const state = {
  mode: "idle",            // idle → celebrate
  blessings: [],
  shuffled: [],
  shuffleIndex: 0,
  blessingTimer: 0,
  lastShowAt: 0,
  lastBlessingAt: 0
};

const safeArea = { left: 0, right: 0, top: 0, bottom: 0 };

/* ================================================================
   文案注入
   ================================================================ */
function applyConfig() {
  document.title = CONFIG.title;
  titleEl.textContent = CONFIG.title;
  hintEl.textContent = CONFIG.hint;
  signatureEl.textContent = CONFIG.signature;
  btnFire.textContent = CONFIG.fireworkButton;
  cakeEl.setAttribute("aria-label", CONFIG.hint);

  // 糖牌数字统一取自 CONFIG.age，避免文案散落
  const ageLabel = $id("ageLabel");
  if (ageLabel) ageLabel.textContent = String(CONFIG.age);
}

/* 把核心祝福按分号拆行，逐字生成 span；标点后自动多停一拍，节奏更从容 */
function renderCore() {
  const segments = CONFIG.coreBlessing.match(/[^；]+；?/g) || [CONFIG.coreBlessing];
  const pauseAfter = new Set(["；", "。", "，", "、", "：", "！", "？", "…"]);

  let clock = 0.75;   // 第一个字出现的时间（秒）
  const step = 0.105; // 字与字之间的间隔
  const pause = 0.24; // 标点后的额外停顿

  coreEl.textContent = "";

  segments.forEach((segment) => {
    const line = document.createElement("span");
    line.className = "core-line";

    Array.from(segment).forEach((char) => {
      const span = document.createElement("span");
      span.className = "ch";
      span.textContent = char === " " ? "\u00A0" : char;
      span.style.setProperty("--d", clock.toFixed(3) + "s");
      line.appendChild(span);

      clock += step;
      if (pauseAfter.has(char)) clock += pause;
    });

    coreEl.appendChild(line);
  });
}

/* ================================================================
   Canvas：星空 + 流星 + 烟花
   ================================================================ */
const skyCanvas = $id("sky");
const ctx = skyCanvas.getContext("2d", { alpha: true });

let dpr = 1;
let W = document.documentElement.clientWidth || window.innerWidth;
let H = document.documentElement.clientHeight || window.innerHeight;

/* 星点颜色（RGB 分量，便于批量设置） */
const STAR_COLORS = ["255,247,232", "206,226,255", "255,223,178", "214,200,255"];
let starGroups = [[], [], [], []];

function buildStars() {
  const total = clamp(Math.round((W * H) / 5400), 70, 240);
  starGroups = [[], [], [], []];

  for (let i = 0; i < total; i++) {
    const roll = Math.random();
    const star = {
      x: Math.random() * W,
      y: Math.random() * H,
      r: roll > 0.93 ? rand(1.6, 2.4) : rand(0.6, 1.5),
      a: rand(0.22, 0.9),
      spd: rand(0.4, 1.9),
      ph: Math.random() * Math.PI * 2,
      big: roll > 0.95
    };
    starGroups[(Math.random() * STAR_COLORS.length) | 0].push(star);
  }
}

function drawStars(t) {
  ctx.globalCompositeOperation = "source-over";

  for (let c = 0; c < STAR_COLORS.length; c++) {
    const list = starGroups[c];
    if (!list.length) continue;
    ctx.fillStyle = "rgb(" + STAR_COLORS[c] + ")";

    for (let i = 0; i < list.length; i++) {
      const s = list[i];
      const twinkle = 0.55 + 0.45 * Math.sin(t * s.spd + s.ph);
      ctx.globalAlpha = s.a * twinkle;
      ctx.fillRect(s.x, s.y, s.r, s.r);

      if (s.big) {
        ctx.globalAlpha = s.a * twinkle * 0.45;
        ctx.fillRect(s.x - s.r * 2.4, s.y + s.r * 0.4, s.r * 5.6, 0.6);
        ctx.fillRect(s.x + s.r * 0.4, s.y - s.r * 2.4, 0.6, s.r * 5.6);
      }
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------- 流星 ---------- */
const meteors = [];

function spawnMeteor() {
  if (reduced) return;
  const angle = rand(0.34, 0.6);
  const speed = rand(560, 940);
  meteors.push({
    x: rand(W * 0.05, W * 1.05),
    y: rand(-40, H * 0.36),
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    life: 0,
    max: rand(0.85, 1.35),
    len: rand(90, 190)
  });
}

function scheduleMeteor() {
  if (reduced) return;
  setTimeout(() => {
    spawnMeteor();
    scheduleMeteor();
  }, rand(3800, 9200));
}

function drawMeteors(dt) {
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.life += dt;
    m.x += m.vx * dt;
    m.y += m.vy * dt;

    if (m.life > m.max || m.x > W + 240 || m.y > H + 160) {
      meteors.splice(i, 1);
      continue;
    }

    const speed = Math.hypot(m.vx, m.vy) || 1;
    const tailX = m.x - (m.vx / speed) * m.len;
    const tailY = m.y - (m.vy / speed) * m.len;
    const alpha = Math.sin(clamp(m.life / m.max, 0, 1) * Math.PI) * 0.9;

    const grad = ctx.createLinearGradient(tailX, tailY, m.x, m.y);
    grad.addColorStop(0, "rgba(255,255,255,0)");
    grad.addColorStop(0.72, "rgba(224,232,255," + alpha * 0.32 + ")");
    grad.addColorStop(1, "rgba(255,255,255," + alpha + ")");

    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(m.x, m.y);
    ctx.stroke();
    ctx.globalCompositeOperation = "source-over";
  }
}

/* ---------- 调色板 ---------- */
const PALETTE = [
  "#ffd89e", "#ffc266", "#fff3d6", "#ffb6c9", "#f08fb2",
  "#9fe8e2", "#86d6ff", "#c9a6ff", "#a98bff", "#fff8ea"
].map((hex) => {
  const n = parseInt(hex.slice(1), 16);
  return {
    r: (n >> 16) & 255,
    g: (n >> 8) & 255,
    b: n & 255,
    key: hex
  };
});

/* 冷 / 暖 / 玫瑰三组，单次烟花只取两两组合，画面更干净 */
const WARM_COLORS = [PALETTE[0], PALETTE[1], PALETTE[2], PALETTE[9]];
const COOL_COLORS = [PALETTE[7], PALETTE[8], PALETTE[5], PALETTE[6]];
const ROSE_COLORS = [PALETTE[3], PALETTE[4]];

const colorStringCache = new Map();

function alphaColor(color, alpha) {
  const bucket = clamp(Math.round(alpha * 12), 0, 12);
  const key = color.key + "_" + bucket;
  let str = colorStringCache.get(key);
  if (!str) {
    str = "rgba(" + color.r + "," + color.g + "," + color.b + "," + (bucket / 12).toFixed(3) + ")";
    colorStringCache.set(key, str);
  }
  return str;
}

/* ---------- 粒子系统 ---------- */
let particles = [];
let flashes = [];
let rockets = [];
let maxParticles = 1400;

function updateMaxParticles() {
  // 按 CSS 视口宽度动态缩放，不用 dpr 整数值做假设
  const widthFactor = clamp(W / 412, 0.8, 1.6);

  if (reduced) {
    maxParticles = Math.round(300 * widthFactor);
  } else if (W <= 480) {
    maxParticles = Math.round(560 * widthFactor);
  } else {
    maxParticles = Math.round(880 * widthFactor);
  }
  maxParticles = clamp(maxParticles, 260, 1500);

  // 412dp 档：同屏祝福最多 2 条，避免拥挤、避免遮挡主视觉
  maxBlessings = W <= 480 ? 2 : 3;
  while (state.blessings.length > maxBlessings) {
    removeBlessing(state.blessings[0]);
  }
}

function pushParticle(p) {
  if (particles.length >= maxParticles) return false;
  particles.push(p);
  return true;
}

function makeParticle(x, y, vx, vy, color, life, size, gravity, drag) {
  return {
    x: x, y: y, px: x, py: y,
    vx: vx, vy: vy,
    color: color,
    life: life, max: life,
    size: size,
    gravity: gravity,
    drag: drag
  };
}

function pushFlash(x, y, color, radius) {
  flashes.push({
    x: x, y: y,
    r: radius * 0.2,
    maxR: radius,
    life: 0.3,
    maxLife: 0.3,
    color: color
  });
}

/* 烟花爆炸：闪光 → 稍延迟主爆 → 拖尾粒子 → 余烬（偶尔二次爆裂） */
function explode(x, y, options) {
  const opts = options || {};
  const power = opts.power || 1;
  const isMobile = W < 640;
  const quiet = !!opts.quiet;

  const types = ["ball", "ball", "ball", "ring", "heart", "double"];
  const type = opts.type || types[(Math.random() * types.length) | 0];

  const warmMain = Math.random() > 0.3;
  const mainColor = warmMain ? pick(WARM_COLORS) : pick(COOL_COLORS);
  const altColor = warmMain ? pick(COOL_COLORS) : pick(ROSE_COLORS);
  const baseSpeed = (isMobile ? 320 : 470) * power;

  // 1) 闪光
  pushFlash(x, y, mainColor, 140 * power * (isMobile ? 0.85 : 1));

  // 高负载时自动减量，高刷屏连续点击也不掉帧
  const load = particles.length / Math.max(1, maxParticles);
  const loadScale = load > 0.75 ? 0.55 : load > 0.5 ? 0.78 : 1;
  const mainCount = Math.round((reduced ? 34 : 88) * power * (isMobile ? 0.7 : 1) * loadScale);
  const lifeMin = reduced ? 1 : 1.3;
  const lifeMax = reduced ? 1.6 : 2.15;

  // 2) 主爆：延迟几十毫秒，让“闪”先于“炸”
  setTimeout(() => {
    if (type === "ring") {
      const count = Math.round(mainCount * 0.92);
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + rand(-0.025, 0.025);
        const speed = baseSpeed * rand(0.84, 0.9);
        pushParticle(makeParticle(
          x, y,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed,
          i % 5 === 0 ? altColor : mainColor,
          rand(lifeMin, lifeMax), rand(1, 1.9),
          rand(34, 58), 0.972
        ));
      }
    } else if (type === "heart") {
      const count = Math.round(mainCount * 0.78);
      for (let i = 0; i < count; i++) {
        const t = (i / count) * Math.PI * 2;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        const speed = baseSpeed * rand(0.8, 0.86);
        pushParticle(makeParticle(
          x, y,
          (hx / 16) * speed + rand(-10, 10),
          (hy / 16) * speed + rand(-10, 10),
          i % 4 === 0 ? altColor : mainColor,
          rand(lifeMin + 0.15, lifeMax + 0.2), rand(1.1, 2),
          rand(60, 86), 0.968
        ));
      }
    } else if (type === "double") {
      const half = Math.round(mainCount / 2);
      for (let i = 0; i < half; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = baseSpeed * rand(0.2, 0.36);
        pushParticle(makeParticle(
          x, y,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          altColor, rand(lifeMin * 0.8, lifeMax * 0.8), rand(0.9, 1.7),
          rand(66, 104), 0.965
        ));
      }
      for (let i = 0; i < half; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = baseSpeed * rand(0.6, 0.94);
        pushParticle(makeParticle(
          x, y,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          mainColor, rand(lifeMin, lifeMax), rand(1.2, 2.2),
          rand(68, 112), 0.966
        ));
      }
    } else {
      for (let i = 0; i < mainCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = baseSpeed * (0.28 + Math.sqrt(Math.random()) * 0.76);
        pushParticle(makeParticle(
          x, y,
          Math.cos(angle) * speed,
          Math.sin(angle) * speed,
          i % 6 === 0 ? altColor : mainColor,
          rand(lifeMin, lifeMax), rand(1, 2),
          rand(60, 108), 0.966
        ));
      }
    }
  }, 55);

  // 3) 余烬：细小慢速金点，像星尘落下
  if (!reduced && !quiet) {
    setTimeout(() => {
      const embers = Math.round(16 * power);
      for (let i = 0; i < embers; i++) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(20, 70);
        pushParticle(makeParticle(
          x + rand(-30, 30), y + rand(-30, 30),
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          pick(WARM_COLORS), rand(1.2, 1.9), rand(0.8, 1.3),
          rand(26, 40), 0.985
        ));
      }
    }, rand(180, 320));
  }

  // 4) 偶尔二次爆裂，制造层次而不噪
  if (!reduced && !quiet && Math.random() > 0.55) {
    setTimeout(() => {
      explode(x + rand(-80, 80), y + rand(-60, 60), { power: 0.42, type: "ring", quiet: true });
    }, rand(260, 480));
  }
}

/* 逐字浮现时的柔光粒子 */
function addSpark(x, y) {
  if (reduced) return;
  const count = 2;
  for (let i = 0; i < count; i++) {
    pushParticle(makeParticle(
      x + rand(-6, 6), y + rand(-6, 6),
      rand(-26, 26), rand(-46, -10),
      pick(PALETTE),
      rand(0.5, 0.95), rand(0.9, 1.7),
      -6, 0.98
    ));
  }
}

/* ---------- 火箭升空 ---------- */
function launchRocket(tx, ty) {
  if (rockets.length >= 7) return;
  rockets.push({
    sx: W * 0.5 + rand(-W * 0.2, W * 0.2),
    sy: H + 26,
    tx: tx,
    ty: ty,
    x: tx,
    y: ty,
    t: 0,
    dur: rand(0.55, 0.92),
    color: pick(PALETTE)
  });
}

function launchRandomFirework() {
  launchRocket(rand(W * 0.1, W * 0.9), rand(H * 0.08, H * 0.5));
}

/* 一场烟花：连续多发 */
function launchShow(count) {
  const n = clamp(Math.round(count), 1, 9);
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      launchRandomFirework();
    }, i * rand(110, 260));
  }
}

function updateRockets(dt) {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.t += dt;
    const k = clamp(r.t / r.dur, 0, 1);
    const e = easeOutCubic(k);
    r.x = r.sx + (r.tx - r.sx) * e;
    r.y = r.sy + (r.ty - r.sy) * e;

    if (k >= 1) {
      rockets.splice(i, 1);
      explode(r.tx, r.ty, { power: rand(0.85, 1.2) });
    }
  }
}

function drawRockets() {
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < rockets.length; i++) {
    const r = rockets[i];
    const grad = ctx.createLinearGradient(r.x, r.y, r.x, r.y + 26);
    grad.addColorStop(0, "rgba(255,244,214,.9)");
    grad.addColorStop(1, "rgba(255,180,100,0)");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(r.x, r.y);
    ctx.lineTo(r.x, r.y + 26);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
}

/* ---------- 粒子更新与绘制 ---------- */
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;

    if (p.life <= 0 || p.y > H + 240) {
      particles.splice(i, 1);
      continue;
    }

    p.px = p.x;
    p.py = p.y;

    p.vy += p.gravity * dt;
    const damp = Math.pow(p.drag, dt * 60);
    p.vx *= damp;
    p.vy *= damp;

    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

function drawParticles() {
  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const alpha = clamp(p.life / p.max, 0, 1);
    // 用「上一帧 → 当前帧」的短线段模拟拖尾
    ctx.strokeStyle = alphaColor(p.color, alpha);
    ctx.lineWidth = p.size * (0.35 + 0.65 * alpha);
    ctx.beginPath();
    ctx.moveTo(p.px, p.py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  ctx.globalCompositeOperation = "source-over";
}

function drawFlashes(dt) {
  ctx.globalCompositeOperation = "lighter";

  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.life -= dt;

    if (f.life <= 0) {
      flashes.splice(i, 1);
      continue;
    }

    const k = 1 - f.life / f.maxLife;
    const radius = f.maxR * (0.35 + k * 0.85);
    const alpha = (1 - k) * 0.85;

    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, radius);
    grad.addColorStop(0, "rgba(255,252,240," + alpha + ")");
    grad.addColorStop(0.35, "rgba(" + f.color.r + "," + f.color.g + "," + f.color.b + "," + alpha * 0.55 + ")");
    grad.addColorStop(1, "rgba(255,255,255,0)");

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(f.x, f.y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalCompositeOperation = "source-over";
}

/* ---------- 画布尺寸与主循环 ---------- */
/* 荣耀「智能分辨率 / 护眼模式」下 screen.width 可能不准，统一用文档视口 */
function getViewportSize() {
  const docEl = document.documentElement;
  let cssW = docEl.clientWidth;
  let cssH = docEl.clientHeight;

  if (!cssW || cssW <= 0) cssW = window.innerWidth;   // 四曲屏 / 旧内核兜底
  if (!cssH || cssH <= 0) cssH = window.innerHeight;

  return {
    cssW: Math.round(cssW || 412),
    cssH: Math.round(cssH || 892)
  };
}

let starsReady = false;

function resizeCanvas() {
  const prevW = W;
  const size = getViewportSize();
  W = size.cssW;
  H = size.cssH;

  // 保留非整数 DPR（如 2.75），只设上限，避免按整数假设写死
  dpr = window.devicePixelRatio || 1;
  if (!isFinite(dpr) || dpr < 1) dpr = 1;
  if (dpr > 3) dpr = 3;

  // 绘图缓冲区 = CSS 尺寸 × DPR，保证非整数 DPR 下依然清晰
  skyCanvas.width = Math.round(W * dpr);
  skyCanvas.height = Math.round(H * dpr);
  skyCanvas.style.width = W + "px";
  skyCanvas.style.height = H + "px";

  // 先重置变换再缩放，避免多次 resize 后累积
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);

  if (!starsReady || W !== prevW) {
    buildStars();
    starsReady = true;
  }

  updateMaxParticles();
}

/* 荣耀 200 Pro 为 120Hz 屏：渲染降频到 60fps，减少发热与掉帧 */
const FRAME_INTERVAL = 1000 / 60;
let lastRenderTime = 0;
let elapsed = 0;

function frame(now) {
  // 先排队下一帧，保证节流跳过时循环不断
  requestAnimationFrame(frame);

  // 祝福计时用真实时间驱动，即使渲染降频也照常出现
  tickBlessing(now);

  if (now - lastRenderTime < FRAME_INTERVAL - 1) return;

  let dt = (now - lastRenderTime) / 1000;
  lastRenderTime = now;
  if (!isFinite(dt) || dt <= 0) dt = 1 / 60;
  if (dt > 0.05) dt = 0.05;   // 切后台回来时避免瞬移

  elapsed += dt;

  ctx.clearRect(0, 0, W, H);
  drawStars(elapsed);
  drawMeteors(dt);
  updateRockets(dt);
  updateParticles(dt);
  drawParticles();
  drawFlashes(dt);
  drawRockets();
}

/* ================================================================
   核心祝福逐字闪光
   ================================================================ */
function fireCharSparks() {
  if (reduced) return;
  const chars = coreEl.querySelectorAll(".ch");

  chars.forEach((el) => {
    const delay = (parseFloat(el.style.getPropertyValue("--d")) || 0) * 1000;
    setTimeout(() => {
      const rect = el.getBoundingClientRect();
      if (rect.width === 0) return;
      addSpark(rect.left + rect.width / 2, rect.top + rect.height / 2);
    }, delay + 260);
  });
}

/* ================================================================
   祝福星河
   ================================================================ */
function measureSafeArea() {
  const rect = centerStack.getBoundingClientRect();
  const pad = 12;
  safeArea.left = rect.left - pad;
  safeArea.right = rect.right + pad;
  safeArea.top = rect.top - pad;
  safeArea.bottom = rect.bottom + pad;
}

function nextBlessing() {
  const pool = CONFIG.blessingPool;
  if (!pool || !pool.length) return "";

  if (state.shuffleIndex >= state.shuffled.length) {
    state.shuffled = shuffle(pool.slice());
    state.shuffleIndex = 0;
  }
  return state.shuffled[state.shuffleIndex++];
}

/* 祝福一律水平居中，落在主视觉上方 / 下方的中央空档，视觉上就在屏幕中间 */
function pickSpot(w, h) {
  w = w || 220;
  h = h || 30;
  measureSafeArea();

  const margin = clamp(W * 0.04, 12, 40);
  const gap = 18;
  const x = Math.max(margin, (W - w) / 2);

  const zones = [];

  const aboveTop = margin;
  const aboveBottom = safeArea.top - gap - h;
  if (aboveBottom >= aboveTop) {
    zones.push({ y0: aboveTop, y1: aboveBottom });
  }

  const belowTop = safeArea.bottom + gap;
  const belowBottom = H - h - margin;
  if (belowBottom >= belowTop) {
    zones.push({ y0: belowTop, y1: belowBottom });
  }

  // 上下两条带随机轮换，避免总在同一侧
  shuffle(zones);

  for (let attempt = 0; attempt < 24 && zones.length; attempt++) {
    const zone = zones[attempt % zones.length];
    const y = rand(zone.y0, zone.y1);
    if (isSpotClear(x, y, w, h)) return { x: x, y: y };
  }

  // 兜底：仍在屏幕中央，优先落在主视觉上方
  if (aboveBottom >= aboveTop) {
    return { x: x, y: aboveBottom };
  }
  if (belowBottom >= belowTop) {
    return { x: x, y: belowTop };
  }

  return { x: x, y: Math.max(12, Math.min(H - h - 12, H * 0.14)) };
}

/* 与已显示的祝福是否冲突 */
function isSpotClear(x, y, w, h) {
  for (let i = 0; i < state.blessings.length; i++) {
    const other = state.blessings[i];
    const ox = parseFloat(other.style.left) || 0;
    const oy = parseFloat(other.style.top) || 0;
    const ow = other.offsetWidth || 120;
    const oh = other.offsetHeight || 24;

    const separated =
      x + w + 10 < ox ||
      ox + ow + 10 < x ||
      y + h + 18 < oy ||
      oy + oh + 18 < y;

    if (!separated) return false;
  }
  return true;
}

function removeBlessing(el) {
  const index = state.blessings.indexOf(el);
  if (index >= 0) state.blessings.splice(index, 1);
  if (el && el.parentNode) el.parentNode.removeChild(el);
}

/* 祝福计时器状态：由主循环每帧检查，不依赖链式 setTimeout */
const blessingState = {
  nextAt: 0
};

function scheduleNextBlessing(now) {
  const range = CONFIG.blessingInterval || [2.4, 3.4];
  const seconds = reduced ? rand(6, 8) : rand(range[0], range[1]);
  blessingState.nextAt = now + seconds * 1000;
}

/* 每帧调用：到点就生成一条，并安排下一条（无限循环） */
function tickBlessing(now) {
  if (state.mode !== "celebrate") return;
  if (!blessingState.nextAt) return;
  if (now < blessingState.nextAt) return;

  spawnBlessing();
  scheduleNextBlessing(now);
}

function spawnBlessing() {
  if (state.mode !== "celebrate") return;

  const pool = CONFIG.blessingPool;
  if (!pool || !pool.length) return;

  while (state.blessings.length >= maxBlessings) {
    removeBlessing(state.blessings[0]);
  }

  const el = document.createElement("p");
  el.className = "blessing";
  el.textContent = nextBlessing();
  el.style.visibility = "hidden";
  el.style.animationDuration = (reduced ? 9 : CONFIG.blessingLife) + "s";
  blessingLayer.appendChild(el);

  const w = el.offsetWidth || 140;
  const h = el.offsetHeight || 24;

  // 先找空位；位置冲突时腾出最旧一条再试，最后兜底到安全区上下带
  let spot = pickSpot(w, h);
  if (!spot && state.blessings.length) {
    removeBlessing(state.blessings[0]);
    spot = pickSpot(w, h);
  }
  if (!spot) {
    spot = {
      x: Math.max(12, (W - w) / 2),
      y: Math.max(12, safeArea.top - h - 12)
    };
  }

  el.style.left = spot.x + "px";
  el.style.top = spot.y + "px";
  el.style.setProperty("--dx", rand(-9, 9).toFixed(1) + "px");
  el.style.visibility = "visible";

  state.blessings.push(el);

  // 动画结束后移除 DOM，防止节点与内存持续增长
  const life = reduced ? 9000 : CONFIG.blessingLife * 1000;
  setTimeout(() => removeBlessing(el), life + 150);
}

/* 手动换一条后重新计时，避免紧接着又冒出一条 */
function resetBlessingTimer() {
  if (state.mode !== "celebrate") return;
  scheduleNextBlessing(performance.now());
}

/* ================================================================
   自动烟花节奏
   ================================================================ */
function scheduleAutoFirework() {
  if (reduced) return;
  setTimeout(() => {
    if (state.mode === "celebrate") {
      launchRandomFirework();
      if (Math.random() > 0.62) {
        setTimeout(launchRandomFirework, rand(260, 520));
      }
    }
    scheduleAutoFirework();
  }, rand(4500, 8200));
}

/* ================================================================
   点击蜡烛 → 许愿流程
   ================================================================ */
function startCelebration() {
  if (state.mode !== "idle") return;

  state.mode = "celebrate";
  state.lastShowAt = performance.now();

  cakeEl.classList.add("blown");
  document.body.classList.add("celebrating");

  // 第一轮盛大烟花
  launchShow(reduced ? 3 : 5);

  // 核心祝福逐字浮现 + 文字周围柔光粒子
  setTimeout(() => {
    fireCharSparks();
  }, 500);

  // 祝福星河：由主循环计时驱动，点击约 2.1s 后出现第一条，之后无限循环
  blessingState.nextAt = performance.now() + 2100;

  // 测量安全区（蛋糕缩小动画结束后再测一次）
  setTimeout(measureSafeArea, 1400);

  // 持续自动烟花
  scheduleAutoFirework();
}

/* ================================================================
   交互绑定
   ================================================================ */
function bindEvents() {
  cakeEl.addEventListener("click", startCelebration);

  cakeEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      startCelebration();
    }
  });

  // “再放一场烟花”：节流，避免连点堆粒子
  btnFire.addEventListener("click", (e) => {
    e.stopPropagation();
    if (state.mode !== "celebrate") return;

    const now = performance.now();
    if (now - state.lastShowAt < 900) return;
    state.lastShowAt = now;

    const heavy = particles.length > maxParticles * 0.45;
    launchShow(heavy ? 3 : 5);
  });

  // 点击页面空白：立即换一条祝福
  document.addEventListener("click", (e) => {
    if (state.mode !== "celebrate") return;
    if (e.target.closest(".btn-fire")) return;
    if (e.target.closest(".cake")) return;
    spawnBlessing();
    resetBlessingTimer();
  });

  // 触屏兼容（部分浏览器 click 延迟明显时也能即时响应）
  document.addEventListener("touchend", (e) => {
    if (state.mode !== "celebrate") return;
    if (e.target.closest(".btn-fire")) return;
    if (e.target.closest(".cake")) return;
  }, { passive: true });

  // 尺寸变化：resize + 旋转 + 地址栏收起（四曲屏兜底）
  let resizeTimer = 0;
  function scheduleResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      resizeCanvas();
      measureSafeArea();
    }, 120);
  }

  window.addEventListener("resize", scheduleResize);

  window.addEventListener("orientationchange", () => {
    // 旋转后尺寸有延迟，等一拍再重新测量
    setTimeout(() => {
      resizeCanvas();
      measureSafeArea();
    }, 220);
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", scheduleResize);
  }

  // 减少动效偏好切换
  const onReduceChange = (event) => {
    reduced = event.matches;
    updateMaxParticles();
  };

  if (reduceQuery.addEventListener) {
    reduceQuery.addEventListener("change", onReduceChange);
  } else if (reduceQuery.addListener) {
    reduceQuery.addListener(onReduceChange);
  }
}

/* ================================================================
   初始化
   ================================================================ */
function init() {
  applyConfig();
  renderCore();
  resizeCanvas();
  measureSafeArea();
  bindEvents();
  scheduleMeteor();

  // 首屏若蛋糕尚未占位完成，下一帧再测一次安全区
  requestAnimationFrame(measureSafeArea);

  requestAnimationFrame(frame);
}

init();
</script>
